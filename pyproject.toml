[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shield-recall"
version = "1.0.0"
description = "Enterprise privacy engine and kill switch for Windows 11 Recall"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["privacy", "windows", "recall", "security", "pii", "redaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.4",
]

[project.scripts]
shield-recall = "main:app"

[project.urls]
Homepage   = "https://github.com/your-org/shield-recall"
Issues     = "https://github.com/your-org/shield-recall/issues"

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts     = "-v --tb=short"
log_cli     = true
log_cli_level = "WARNING"

# ── ruff (linter / formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]   # long lines handled by formatter

[tool.ruff.isort]
known-first-party = ["config", "database", "os_control", "pii_engine"]

# ── mypy (optional static type checking) ────────────────────────────────────
[tool.mypy]
python_version        = "3.11"
ignore_missing_imports = true
strict                = false
warn_unused_ignores   = true
